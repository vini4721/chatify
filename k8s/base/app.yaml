apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatify
  labels:
    app: chatify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatify
  template:
    metadata:
      labels:
        app: chatify
    spec:
      containers:
        - name: chatify
          image: chatify:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: chatify-config
            - secretRef:
                name: chatify-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: chatify
  labels:
    app: chatify
spec:
  type: LoadBalancer
  selector:
    app: chatify
  ports:
    - port: 80
      targetPort: 3000
